# Default values for TensorStore + GCSFuse benchmark.

nodeSelector:
  cloud.google.com/gke-nodepool: c4-standard-192

serviceAccount: default
namespace: default
workload_launcher: launcher.sh

workload:
  configFile: tensorstore_bench.py
  configPath: /workload/
  image: python:3.11-slim
  nodes: 1
  ranksPerNode: 1
  singlePodPerNode: true
  requirements: ""
  numWorkers: 8
  tensorstoreShape: "1000,1000,100"
  tensorstoreChunks: "100,100,100"
  tensorstoreDtype: "float32"
  tensorstoreDriver: "zarr"
  tensorstoreIterations: 1
  tensorstorePerWorkerShape: "false"
  envs:
    - name: LOG_LEVEL
      value: INFO

gcsfs:
  datasetPath: ""
  ckptWritePath: ""
  ckptLoadPath: ""

gcsfuse:
  enabled: true
  datasetBucket: ""
  checkpointBucket: ""
  mountPathDataset: "/gcs/dataset"
  mountPathCheckpoint: "/gcs/checkpoints"
  mountOptions: "implicit-dirs"
  sidecarImage: ""

lustre:
  enabled: false
  datasetPvc: ""
  checkpointPvc: ""
  mountPathDataset: "/lustre/dataset"
  mountPathCheckpoint: "/lustre/checkpoints"
