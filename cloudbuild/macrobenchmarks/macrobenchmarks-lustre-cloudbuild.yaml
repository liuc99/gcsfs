substitutions:
  _INFRA_PREFIX: ""
  _ZONE: ""
  _GKE_SERVICE_ACCOUNT: ""
  _WORKLOAD: "hf-pytorch-lightning-cpu"
  _BUCKET_TYPE: "regional"
  _MACHINE_TYPE: "c4-standard-192"
  _ENABLE_TIER1_NETWORKING: "true"
  _USE_LUSTRE: "true"
  _LUSTRE_INSTANCE: ""
  _LUSTRE_DATASET_PVC: "lustre-dataset-pvc"
  _LUSTRE_CHECKPOINT_PVC: "lustre-checkpoint-pvc"
  _LUSTRE_CAPACITY: "12000Gi"
  _USE_GCSFUSE: "true"
  _GCSFUSE_ENABLE_STREAM_WRITE: "true"
  _GCSFUSE_MOUNT_OPTIONS: "implicit-dirs"
  _NETWORK_NAME: ""
  _SUBNET_NAME: ""
  _ADDITIONAL_CHECKPOINT_PATHS: ""
  _REUSE_DATASET_BUCKET: "false"
  _ASYNC_CHECKPOINT: "false"
  _RESERVATION_AFFINITY: "any"
  _RESERVATION_NAME: ""
  _NODES: "2"
  _RANKS_PER_NODE: "4"
  _STEPS: "100"
  _CHECKPOINT_INTERVAL: "25"
  _CKPT_TO_KEEP: "1"
  _DATASET_PATH: ""
  _MODEL_ID: "gs://huggingface-model-weights/Llama-3.1-8B"
  _HF_TOKEN: ""
  _CHECKPOINT_LOAD_PATH: ""
  _REQUIREMENTS: ""
  _IMAGE: "nvcr.io/nvidia/pytorch:26.05-py3"
  _TRAINING_STRATEGY: "ddp"
  _SEED_CHECKPOINT: "true"
  _SIMULATED_STEP_COMPUTE_SECONDS: "1.0"
  _PER_DEVICE_BATCH: "8"
  _GRAD_ACCUM: "1"
  _DATALOADER_WORKERS: "16"
  _JOBSET_VERSION: "v0.12.0"
  _SKIP_CLEANUP: "false"

steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "init-variables"
    entrypoint: "bash"
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "BUILD_ID=${BUILD_ID}"
      - "BRANCH_NAME=${BRANCH_NAME}"
      - "_INFRA_PREFIX=${_INFRA_PREFIX}"
      - "_ZONE=${_ZONE}"
      - "_GKE_SERVICE_ACCOUNT=${_GKE_SERVICE_ACCOUNT}"
      - "_DATASET_PATH=${_DATASET_PATH}"
      - "_REQUIREMENTS=${_REQUIREMENTS}"
      - "_BUCKET_TYPE=${_BUCKET_TYPE}"
      - "_MACHINE_TYPE=${_MACHINE_TYPE}"
      - "_NODES=${_NODES}"
      - "_RANKS_PER_NODE=${_RANKS_PER_NODE}"
      - "_STEPS=${_STEPS}"
      - "_CHECKPOINT_INTERVAL=${_CHECKPOINT_INTERVAL}"
      - "_CKPT_TO_KEEP=${_CKPT_TO_KEEP}"
      - "_CHECKPOINT_LOAD_PATH=${_CHECKPOINT_LOAD_PATH}"
      - "_MODEL_ID=${_MODEL_ID}"
      - "_TRAINING_STRATEGY=${_TRAINING_STRATEGY}"
      - "_SEED_CHECKPOINT=${_SEED_CHECKPOINT}"
      - "_ENABLE_TIER1_NETWORKING=${_ENABLE_TIER1_NETWORKING}"
      - "_USE_LUSTRE=${_USE_LUSTRE}"
      - "_LUSTRE_INSTANCE=${_LUSTRE_INSTANCE}"
      - "_LUSTRE_DATASET_PVC=${_LUSTRE_DATASET_PVC}"
      - "_LUSTRE_CHECKPOINT_PVC=${_LUSTRE_CHECKPOINT_PVC}"
      - "_LUSTRE_CAPACITY=${_LUSTRE_CAPACITY}"
      - "_REUSE_DATASET_BUCKET=${_REUSE_DATASET_BUCKET}"
      - "_ASYNC_CHECKPOINT=${_ASYNC_CHECKPOINT}"
      - "_NETWORK_NAME=${_NETWORK_NAME}"
      - "_SUBNET_NAME=${_SUBNET_NAME}"
      - "_ADDITIONAL_CHECKPOINT_PATHS=${_ADDITIONAL_CHECKPOINT_PATHS}"
      - "_USE_GCSFUSE=${_USE_GCSFUSE}"
      - "_GCSFUSE_ENABLE_STREAM_WRITE=${_GCSFUSE_ENABLE_STREAM_WRITE}"
      - "_GCSFUSE_MOUNT_OPTIONS=${_GCSFUSE_MOUNT_OPTIONS}"
    args: ["cloudbuild/macrobenchmarks/scripts/init_variables.sh"]
    waitFor: ["-"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "cleanup-leaked-resources"
    entrypoint: "bash"
    allowFailure: true
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "_INFRA_PREFIX=${_INFRA_PREFIX}"
    args: ["cloudbuild/macrobenchmarks/scripts/cleanup_leaked_resources.sh"]
    waitFor: ["init-variables"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "create-buckets"
    entrypoint: "bash"
    allowFailure: true
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "LOCATION=${LOCATION}"
      - "_BUCKET_TYPE=${_BUCKET_TYPE}"
      - "_ZONE=${_ZONE}"
      - "_DATASET_PATH=${_DATASET_PATH}"
      - "_REUSE_DATASET_BUCKET=${_REUSE_DATASET_BUCKET}"
    args: ["cloudbuild/macrobenchmarks/scripts/create_buckets.sh"]
    waitFor: ["init-variables"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "create-cluster"
    entrypoint: "bash"
    allowFailure: true
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "_ZONE=${_ZONE}"
      - "_GKE_SERVICE_ACCOUNT=${_GKE_SERVICE_ACCOUNT}"
      - "_MACHINE_TYPE=${_MACHINE_TYPE}"
      - "_NODES=${_NODES}"
      - "_JOBSET_VERSION=${_JOBSET_VERSION}"
      - "_ENABLE_TIER1_NETWORKING=${_ENABLE_TIER1_NETWORKING}"
      - "_RESERVATION_AFFINITY=${_RESERVATION_AFFINITY}"
      - "_RESERVATION_NAME=${_RESERVATION_NAME}"
      - "_USE_LUSTRE=${_USE_LUSTRE}"
      - "_LUSTRE_INSTANCE=${_LUSTRE_INSTANCE}"
      - "_LUSTRE_DATASET_PVC=${_LUSTRE_DATASET_PVC}"
      - "_LUSTRE_CHECKPOINT_PVC=${_LUSTRE_CHECKPOINT_PVC}"
      - "_LUSTRE_CAPACITY=${_LUSTRE_CAPACITY}"
    args: ["cloudbuild/macrobenchmarks/scripts/create_cluster.sh"]
    waitFor: ["init-variables"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "seed-checkpoint"
    entrypoint: "bash"
    allowFailure: true
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "_ZONE=${_ZONE}"
      - "_WORKLOAD=${_WORKLOAD}"
      - "_DATASET_PATH=${_DATASET_PATH}"
      - "_MODEL_ID=${_MODEL_ID}"
      - "_IMAGE=${_IMAGE}"
      - "_TRAINING_STRATEGY=${_TRAINING_STRATEGY}"
      - "_HF_TOKEN=${_HF_TOKEN}"
      - "_NODES=${_NODES}"
      - "_RANKS_PER_NODE=${_RANKS_PER_NODE}"
      - "_MACHINE_TYPE=${_MACHINE_TYPE}"
      - "_REQUIREMENTS=${_REQUIREMENTS}"
      - "_SEED_CHECKPOINT=${_SEED_CHECKPOINT}"
      - "_CHECKPOINT_LOAD_PATH=${_CHECKPOINT_LOAD_PATH}"
      - "_USE_LUSTRE=${_USE_LUSTRE}"
      - "_LUSTRE_DATASET_PVC=${_LUSTRE_DATASET_PVC}"
      - "_LUSTRE_CHECKPOINT_PVC=${_LUSTRE_CHECKPOINT_PVC}"
    args: ["cloudbuild/macrobenchmarks/scripts/seed_checkpoint.sh"]
    waitFor: ["create-cluster", "create-buckets"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "run-workload"
    entrypoint: "bash"
    allowFailure: true
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "_ZONE=${_ZONE}"
      - "_WORKLOAD=${_WORKLOAD}"
      - "_DATASET_PATH=${_DATASET_PATH}"
      - "_CHECKPOINT_LOAD_PATH=${_CHECKPOINT_LOAD_PATH}"
      - "_MODEL_ID=${_MODEL_ID}"
      - "_TRAINING_STRATEGY=${_TRAINING_STRATEGY}"
      - "_SIMULATED_STEP_COMPUTE_SECONDS=${_SIMULATED_STEP_COMPUTE_SECONDS}"
      - "_HF_TOKEN=${_HF_TOKEN}"
      - "_STEPS=${_STEPS}"
      - "_CHECKPOINT_INTERVAL=${_CHECKPOINT_INTERVAL}"
      - "_CKPT_TO_KEEP=${_CKPT_TO_KEEP}"
      - "_MACHINE_TYPE=${_MACHINE_TYPE}"
      - "_NODES=${_NODES}"
      - "_RANKS_PER_NODE=${_RANKS_PER_NODE}"
      - "_REQUIREMENTS=${_REQUIREMENTS}"
      - "_SEED_CHECKPOINT=${_SEED_CHECKPOINT}"
      - "_IMAGE=${_IMAGE}"
      - "_PER_DEVICE_BATCH=${_PER_DEVICE_BATCH}"
      - "_GRAD_ACCUM=${_GRAD_ACCUM}"
      - "_DATALOADER_WORKERS=${_DATALOADER_WORKERS}"
      - "_USE_LUSTRE=${_USE_LUSTRE}"
      - "_LUSTRE_DATASET_PVC=${_LUSTRE_DATASET_PVC}"
      - "_LUSTRE_CHECKPOINT_PVC=${_LUSTRE_CHECKPOINT_PVC}"
      - "_USE_GCSFUSE=${_USE_GCSFUSE}"
      - "_ADDITIONAL_CHECKPOINT_PATHS=${_ADDITIONAL_CHECKPOINT_PATHS}"
    args: ["cloudbuild/macrobenchmarks/scripts/run_workload.sh"]
    waitFor: ["seed-checkpoint"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "scrape-metrics"
    entrypoint: "bash"
    allowFailure: true
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "_STEPS=${_STEPS}"
      - "_CHECKPOINT_INTERVAL=${_CHECKPOINT_INTERVAL}"
      - "_CKPT_TO_KEEP=${_CKPT_TO_KEEP}"
      - "_CHECKPOINT_LOAD_PATH=${_CHECKPOINT_LOAD_PATH}"
      - "_SEED_CHECKPOINT=${_SEED_CHECKPOINT}"
      - "_WORKLOAD=${_WORKLOAD}"
      - "_REQUIREMENTS=${_REQUIREMENTS}"
      - "_IMAGE=${_IMAGE}"
      - "_BUCKET_TYPE=${_BUCKET_TYPE}"
      - "_MACHINE_TYPE=${_MACHINE_TYPE}"
      - "_ZONE=${_ZONE}"
      - "_NODES=${_NODES}"
      - "_RANKS_PER_NODE=${_RANKS_PER_NODE}"
      - "_DATASET_PATH=${_DATASET_PATH}"
      - "_MODEL_ID=${_MODEL_ID}"
      - "_TRAINING_STRATEGY=${_TRAINING_STRATEGY}"
      - "_SIMULATED_STEP_COMPUTE_SECONDS=${_SIMULATED_STEP_COMPUTE_SECONDS}"
      - "_PER_DEVICE_BATCH=${_PER_DEVICE_BATCH}"
      - "_GRAD_ACCUM=${_GRAD_ACCUM}"
      - "_DATALOADER_WORKERS=${_DATALOADER_WORKERS}"
      - "_USE_LUSTRE=${_USE_LUSTRE}"
    args: ["cloudbuild/macrobenchmarks/scripts/scrape_metrics.sh"]
    waitFor: ["run-workload"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "cleanup-helm"
    entrypoint: "bash"
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "_ZONE=${_ZONE}"
      - "_SKIP_CLEANUP=${_SKIP_CLEANUP}"
    args: ["cloudbuild/macrobenchmarks/scripts/cleanup_helm.sh"]
    waitFor: ["scrape-metrics"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "cleanup-cluster"
    entrypoint: "bash"
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "_ZONE=${_ZONE}"
      - "_SKIP_CLEANUP=${_SKIP_CLEANUP}"
    args: ["cloudbuild/macrobenchmarks/scripts/cleanup_cluster.sh"]
    waitFor: ["cleanup-helm"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "delete-buckets"
    entrypoint: "bash"
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "_SKIP_CLEANUP=${_SKIP_CLEANUP}"
      - "_REUSE_DATASET_BUCKET=${_REUSE_DATASET_BUCKET}"
    args: ["cloudbuild/macrobenchmarks/scripts/delete_buckets.sh"]
    waitFor: ["scrape-metrics"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "check-failure"
    entrypoint: "bash"
    args: ["cloudbuild/macrobenchmarks/scripts/check_failure.sh"]
    waitFor: ["cleanup-cluster", "delete-buckets"]

timeout: "21600s"

options:
  logging: CLOUD_LOGGING_ONLY
